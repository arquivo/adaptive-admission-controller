# AAC example backend policy configuration.
#
# This file is the canonical reference for default concurrency/queue values
# (docs/implementation_plan.md §2.3). Values marked "placeholder" below are
# tracked in docs/open_tbd.md and are installation-dependent — they must be
# overridden per environment rather than resolved once here.

ingress:
  # Peers (REMOTE_ADDR) allowed to set X-Forwarded-For — the front-end
  # Apache/Caddy IP(s). A request from any other peer is rejected 403
  # before classification/scoring ever runs (FR-010a).
  trusted_proxies: ["127.0.0.1", "::1"] # default: localhost (IPv4 + IPv6) for a
    # co-located front-end; installation-dependent — set to the real front-end
    # IP(s)/CIDRs when Apache/Caddy runs on a separate host
  # Client IP = the X-Forwarded-For entry this many hops from the right.
  # Default 1 (rightmost = the hop immediately before the trusted proxy).
  xff_trusted_hops: 1

geoip:
  # Local MaxMind GeoLite2 files the AAC reads at startup for country/ASN
  # lookups (FR-013, FR-013a). Two separate files — MaxMind's free tier has
  # no combined country+ASN database. Refreshed independently via
  # `scripts/update_geoip_db.py --edition <GeoLite2-City|GeoLite2-ASN>
  # --dest-path <path>` (never invoked by the AAC process itself); the AAC
  # only picks up a refreshed file on its next restart. Placeholder paths —
  # see docs/open_tbd.md.
  city_db_path: /var/lib/aac/GeoLite2-City.mmdb
  asn_db_path: /var/lib/aac/GeoLite2-ASN.mmdb

auth:
  # Keycloak JWT verification (FR-012) — purely a scoring/priority input, a
  # verified token buys a request a higher `researcher` base score below; the
  # AAC has no login flow of its own and never gates access on this. Off by
  # default: every request classifies as `anonymous` until a real realm is
  # configured. `issuer`/`jwks_url` are installation-dependent placeholders —
  # see docs/open_tbd.md.
  enabled: false
  issuer: https://keycloak.example.org/realms/arquivo
  jwks_url: https://keycloak.example.org/realms/arquivo/protocol/openid-connect/certs
  audience: aac
  jwks_refresh_seconds: 300

observability:
  debug_headers:
    # Attaches X-AAC-Backend/Score/Exempt/Reject-Reason to every response
    # (FR-074). Off by default — see docs/decision_log.md D2.
    enabled: false

scoring:
  exempt_countries: ["PT"] # skip subnet/24, IPv6-prefix, ASN, and country penalties for these
  ipv6_prefix_length: 56 # /48 or /56 — bucket size for IPv6 abuse aggregation (FR-022)

  base_scores: # per user_class — identity-only enum, see requirements.md §4.1a
    anonymous: 100
    researcher: 80
    service_account: 90
    internal: 100
    unknown: 50

  score_clamp: { min: -100, max: 100 }

  # Global default penalty thresholds. Each dimension is a LIST of one or
  # more independent windows. Below soft_threshold: no penalty. Between
  # soft/hard: soft_penalty applies. At/above hard_threshold: hard_penalty
  # applies. Per-window penalties for the same dimension are summed.
  default_penalties:
    ip: [{ window_seconds: 10, soft_threshold: 10, hard_threshold: 30, soft_penalty: 10, hard_penalty: 40 }]
    net24: [{ window_seconds: 60, soft_threshold: 50, hard_threshold: 200, soft_penalty: 10, hard_penalty: 40 }]
    net6: [{ window_seconds: 60, soft_threshold: 50, hard_threshold: 200, soft_penalty: 10, hard_penalty: 40 }]
    asn: [{ window_seconds: 60, soft_threshold: 200, hard_threshold: 1000, soft_penalty: 20, hard_penalty: 70 }]
    country: [{ window_seconds: 300, soft_threshold: 500, hard_threshold: 2000, soft_penalty: 5, hard_penalty: 30 }]
    user:
      - { window_seconds: 60, soft_threshold: 50, hard_threshold: 200, soft_penalty: 5, hard_penalty: 40 }
      - { window_seconds: 3600, soft_threshold: 500, hard_threshold: 2000, soft_penalty: 10, hard_penalty: 60 } # best-guess default — tune with production data

backends:
  # --- Search APIs (2 independent services, separate hardware/collections;
  # each talks to its own SolrCloud cluster internally) ---
  - name: page-search-api
    upstreams: [{ url: http://page-search-api:8080 }] # environment-specific — see docs/open_tbd.md
    match:
      path_prefix: /textsearch
    controller: adaptive
    min_concurrency: 20
    initial_concurrency: 100
    max_concurrency: 500
    target_p95_ms: 100
    timeout_rate_threshold: 0.05 # best-guess default — tune with production data
    error_rate_threshold: 0.10 # best-guess default — tune with production data
    connect_timeout_seconds: 5
    backend_timeout_seconds: 60
    queue_max_size: 5000
    queue_timeout_seconds: 300
    # Per-backend scoring override: deep-merges over scoring.default_penalties/
    # base_scores above. Only list the fields/dimensions this backend needs to
    # diverge on.
    scoring:
      overrides:
        penalties:
          ip: { soft_threshold: 5, hard_threshold: 15, soft_penalty: 15, hard_penalty: 50 }

  - name: image-search-api
    upstreams: [{ url: http://image-search-api:8080 }] # environment-specific — see docs/open_tbd.md
    match:
      path_prefix: /imagesearch
    controller: adaptive
    min_concurrency: 20
    initial_concurrency: 100
    max_concurrency: 500
    target_p95_ms: 100
    timeout_rate_threshold: 0.05 # best-guess default, see page-search-api above
    error_rate_threshold: 0.10 # best-guess default, see page-search-api above
    connect_timeout_seconds: 5
    backend_timeout_seconds: 60
    queue_max_size: 5000
    queue_timeout_seconds: 300
    scoring:
      overrides:
        penalties:
          ip: { soft_threshold: 5, hard_threshold: 15, soft_penalty: 15, hard_penalty: 50 }

  # --- pywb (4 independent uwsgi processes, own port each) ---
  - name: pywb-framed
    # Illustrative multi-instance example: two identical replicas of the
    # same pywb-framed service behind one backend name. `upstreams` accepts
    # any number of entries — the AAC selects whichever currently-healthy
    # instance has the fewest in-flight requests ("most capacity
    # available"), and pins repeat clients to the same instance by default
    # (`sticky_sessions`, on unless overridden below) unless that instance
    # goes down or the backend as a whole is saturated. See
    # docs/configuration.md "Multi-instance load balancing".
    upstreams:
      - url: http://pywb-framed-1:8080
      - url: http://pywb-framed-2:8080
    match:
      path_prefix: /wayback
    controller: fixed
    concurrency_limit: 100
    connect_timeout_seconds: 5
    backend_timeout_seconds: 60
    queue_max_size: 2000
    queue_timeout_seconds: 300
    health_check_interval_seconds: 10 # how often down instances are re-probed
    sticky_sessions: true # default; set false to disable client pinning
    sticky_session_ttl_seconds: 300 # a pin idle this long is dropped

  - name: pywb-noframe
    upstreams: [{ url: http://pywb-noframe:8081 }]
    # Illustrative backup-instance example: only used once every entry above
    # in `upstreams` is unhealthy — a pure emergency-standby pool, never
    # preferred just because the primary is saturated. See
    # docs/configuration.md "Multi-instance load balancing" > "Backup
    # instances".
    backup_upstreams:
      - url: http://pywb-noframe-standby:8081
    match:
      path_prefix: /noFrame/replay
    controller: fixed
    concurrency_limit: 100
    connect_timeout_seconds: 5
    backend_timeout_seconds: 60
    queue_max_size: 2000
    queue_timeout_seconds: 300

  - name: pywb-patching
    upstreams: [{ url: http://pywb-patching:8082 }]
    match:
      path_prefix: /noFrame/patching
    controller: fixed
    concurrency_limit: 10
    connect_timeout_seconds: 5
    backend_timeout_seconds: 60
    queue_max_size: 100
    queue_timeout_seconds: 300

  - name: pywb-archivepagenow
    upstreams: [{ url: http://pywb-archivepagenow:8083 }]
    match:
      path_prefix: /save
    controller: fixed
    concurrency_limit: 5
    # Longer than the other five backends: ArchivePageNow performs a live
    # capture of the target page rather than serving from the existing
    # archive, so it is expected to take substantially longer per request.
    connect_timeout_seconds: 10
    backend_timeout_seconds: 120
    queue_max_size: 50
    queue_timeout_seconds: 300
