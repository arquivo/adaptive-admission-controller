services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aac:
    build: .
    ports:
      - "8000:8000"
    environment:
      AAC_CONFIG_PATH: /app/config/backends.yaml
      AAC_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
